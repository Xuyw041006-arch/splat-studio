<!doctype html><html><meta charset="utf-8"><title>Splat Studio · Screenshot Card</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3e9;color:#17372e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.board{width:1280px;height:720px;padding:32px 32px 25px;position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d5ddcf;padding-bottom:18px;font-size:17px}.brand{font-size:23px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:13px}.logo{width:30px;height:30px;border-radius:50%;background:#658a74;box-shadow:9px 5px 0 -1px #bbd8be}.top .meta{color:#6a7a6f;font-size:14px;letter-spacing:2px}.content{display:grid;grid-template-columns:248px 1fr;gap:24px;align-items:center;padding-top:26px;height:553px}.step{font-size:13px;font-weight:600;letter-spacing:3px;color:#7a8f7e;margin-bottom:18px}.title{text-wrap:balance;font-size:29px;letter-spacing:-1.1px;line-height:1.3;font-weight:630;margin:0 0 22px}.desc{font-size:15px;line-height:1.8;color:#63756a}.detail{margin-top:26px;border-left:3px solid #b2d6ba;padding-left:17px;font-size:13px;line-height:1.8;color:#7a8f7e}.frame{border-radius:14px;overflow:hidden;box-shadow:0 26px 55px #143e2720;background:#12211d}.frame.compact{width:540px;max-width:100%;justify-self:center}.frame img{width:100%;height:auto;display:block}.footer{display:flex;justify-content:space-between;position:absolute;bottom:22px;left:32px;right:32px;padding-top:22px;border-top:1px solid #d5ddcf;font-size:10px;letter-spacing:1px;color:#7a8a7e}</style><div class="board"><header class="top"><div class="brand"><i class="logo"></i>Splat Studio</div><div class="meta">PRODUCT WALKTHROUGH / 2026</div></header><div class="content"><aside><div class="step" id="step"></div><h1 class="title" id="title"></h1><p class="desc" id="desc"></p><div class="detail" id="detail"></div></aside><div class="frame"><img id="screen"></div></div><footer class="footer"><span>REAL APP CAPTURES · TEATIME</span><span id="foot"></span></footer></div><script>const cards=[{"id": "01-home", "group": "start", "zh": ["两种入口，清晰开始", "从照片新建场景，或导入已经完成的重建。首页只保留这两个入口。"], "en": ["Two ways to begin", "Create a scene from photos, or import an existing reconstruction. The home screen keeps both paths easy to find."]}, {"id": "02-name", "group": "start", "zh": ["为场景命名，加入照片", "这次演示使用 Teatime 图片集。场景名称会沿用到后续的保存与导出流程。"], "en": ["Name the scene. Add photos.", "This walkthrough uses the Teatime image set. The scene name carries through to saving and export."]}, {"id": "03-analysis", "group": "start", "zh": ["让照片决定下一步", "本次读入 177 张照片，177 张独立照片，连接度预检为 97%，App 建议直接重建。连接度是照片重叠的预检指标；相机位姿在后续重建中求解。"], "en": ["Let the photos guide the next step", "The App checks 177 photos, finds 177 unique images and reports 97% photo connectivity. It recommends standard reconstruction. Connectivity is an overlap precheck; camera poses are solved during reconstruction."]}, {"id": "22-sparse-six", "group": "sparse", "zh": ["六张照片，按需进入稀疏流程", "导入真实的 6 张 Teatime 照片后，App 检测到重叠并建议稀疏重建，同时允许按需补全。此页验证输入判断；本次新训练的展示模型来自完整 177 张照片。"], "en": ["Six photos trigger the sparse workflow", "With six real Teatime photos, the App detects overlap and recommends sparse reconstruction with optional completion. This verifies input routing; the newly trained showcase model uses all 177 photos."]}, {"id": "27-two-view-completion", "group": "sparse", "zh": ["只有两个视角时，提示补全", "导入两张照片后，App 建议稀疏重建并补全，也提醒看不到的背面可能缺失。本图验证自动建议与选择入口，没有将未知背面描述为已恢复的真实几何。"], "en": ["Two views prompt completion", "With two photos, the App recommends sparse reconstruction with completion and explains that unseen backsides may remain missing. This captures the automatic recommendation and choice, not a verified recovery of hidden geometry."]}, {"id": "23-capture-information", "group": "sparse", "zh": ["自己的照片也可以作为输入", "已知拍摄覆盖角度时可以填写，并可导入与照片匹配的标定内参。相机位姿由照片求解；数量与连接度预检不等同于已经恢复精确拍摄角度。"], "en": ["Bring photos from your own camera", "Optionally provide a known coverage angle and calibrated intrinsics matched to the photos. Camera poses are solved from the images; count and connectivity checks do not establish precise shooting angles."]}, {"id": "04-semantics", "group": "understand", "zh": ["按需要加入物品识别", "只想查看场景外观，可以选择普通重建；需要按物品查找和编辑，则开启语义功能。"], "en": ["Add object understanding when needed", "Choose appearance-only reconstruction for visual exploration, or enable semantics for finding and editing objects."]}, {"id": "05-priority", "group": "understand", "zh": ["告诉 App，哪些物品更重要", "本次输入“熊、咖啡杯”。这些名称用于匹配照片中的真实区域，核对区域后才能用于重点训练。切换界面语言会保留用户原始输入。"], "en": ["Tell the App what matters", "This demo requests the bear and coffee mug. Their names are matched to real image regions, which are reviewed before priority training. Switching languages preserves the original user input."]}, {"id": "24-manual-region", "group": "understand", "zh": ["直接在照片上标出重要物品", "在 6 张照片示例中，沿熊的可见上身绘制 35 个顶点，并实际保存掩码。名称、跨视角 ID 与层级用于组织标注；同一实例仍需要其他视角的证据。"], "en": ["Mark the object directly in a photo", "In the six-photo example, 35 vertices outline the visible upper body of the bear, and the mask is saved. A name, cross-view ID and level organize the annotation; matching the same instance still requires other views."]}, {"id": "25-priority-review", "group": "understand", "zh": ["核对实际区域，再用于重点训练", "绿色覆盖对应刚刚保存的手工区域，确认后才进入任务。图中的 100% 是手工标注的记录分数，不代表分割准确率。真实 A100 训练另外核对了 28 个候选，保留 11 个区域。"], "en": ["Review the region before priority training", "The green overlay is the manually saved region. Confirmation includes it in the task. Its 100% score is a manual-annotation field, not measured accuracy. The separate A100 run reviewed 28 candidates and retained 11."]}, {"id": "06-fast-a100", "group": "compute", "zh": ["选择效果与计算设备", "此次实际任务选择快速模式和 Colab A100：7,000 步 RGB 训练，语义基础预算 400 步、最多抽取 12 个视角；重点细化使用最后 400 步预算。"], "en": ["Choose quality and compute", "This run uses Fast mode on a Colab A100: 7,000 RGB iterations, a base semantic budget of 400 steps over up to 12 sampled views, and the final 400 RGB steps reserved for priority detail."]}, {"id": "07-estimate", "group": "compute", "zh": ["开始前，核对时间和配置", "确认页展示场景、照片数量、模式、设备和预估耗时。本次页面估算为 8–27 分钟；实际执行耗时单独记录。"], "en": ["Review the plan before starting", "The confirmation screen summarizes the scene, photo count, mode, device and estimated duration. It estimates 8–27 minutes here; actual execution time is recorded separately."]}, {"id": "08-cloud-guide", "group": "compute", "zh": ["没有 GPU 服务器，也能使用 Colab", "App 内置 Colab 配置说明，通过任务 ZIP 与结果文件完成云端交换。这次演示在真实 A100 环境中执行。"], "en": ["Use Colab without owning a GPU server", "Built-in instructions explain Colab setup and task/result file exchange. This demo executes in a real A100 environment."]}, {"id": "09-local-guide", "group": "compute", "zh": ["本地 NVIDIA 环境有对应指引", "用户可以查看 Windows / Linux 的本地 CUDA 训练配置步骤。这里展示的是 App 内的配置说明。"], "en": ["Local NVIDIA setup is documented", "Users can open the Windows / Linux CUDA setup instructions inside the App. This screenshot demonstrates the built-in guide."]}, {"id": "10-server-guide", "group": "compute", "zh": ["也可以连接自己的云端工作流", "其他云服务器同样使用任务包执行方式。依赖安装、任务启动与结果导回步骤集中在 App 内的说明中。"], "en": ["Bring your own cloud workflow", "Other GPU servers use the same task-package workflow. Dependency setup, task execution and result import are explained in the App."]}, {"id": "26-cloud-package", "group": "compute", "zh": ["任务带着照片和设置交给云端", "六照片示例已实际导出任务 ZIP，包含确认的重点区域。按包内说明在云端执行，再回到 App 导入结果。这一示例停在任务准备阶段，页面明确显示尚未训练。"], "en": ["Transfer photos and settings to the cloud", "The six-photo example exports a task ZIP with its confirmed priority region. Run it using the included instructions, then import the result. This example stops at preparation; the App explicitly shows that training has not started."]}, {"id": "14-import-type", "group": "import", "zh": ["已有成果，直接打开", "导入时先选择场景是否包含物品语义。只有外观的模型同样可以进入三维浏览；语义模型还能按物品进行操作。"], "en": ["Open an existing result", "Choose whether the imported scene includes object semantics. Appearance-only models support 3D exploration; semantic scenes also support object-based interaction."]}, {"id": "15-import-files", "group": "import", "zh": ["让高斯与语义正确配对", "本次导入真实训练得到的 point_cloud.ply 和配套 semantics.zip。App 校验模型与语义的对应关系，再打开完整场景。"], "en": ["Pair geometry with its semantics", "This demo imports the trained point_cloud.ply and its matching semantics.zip. The App validates their correspondence before opening the complete scene."]}, {"id": "16-teatime-viewer", "group": "explore", "zh": ["打开真实训练的 Teatime", "177 张照片在 A100 上完成快速训练。完整模型包含 1,200,686 个高斯和三阶球谐；核心区域筛选只影响显示。拖拽旋转、滚轮缩放、右键平移。"], "en": ["Explore the trained Teatime scene", "A real Fast run on A100 turns 177 photos into 1,200,686 Gaussians with degree-three spherical harmonics. Core-region filtering changes visibility only. Drag to orbit, scroll to zoom, and right-drag to pan."]}, {"id": "17-semantic-search", "group": "explore", "zh": ["搜索物品，查看区域置信度", "输入 table 筛选语义目录，选中区域显示 14,543 个高斯和 52% 跨视角置信度。该数值是匹配权重；此次区域只覆盖桌面的一部分。"], "en": ["Search objects and inspect confidence", "Searching for table filters the semantic catalog. This selected region contains 14,543 Gaussians with 52% cross-view confidence. The score is a matching weight; this region covers part of the table."]}, {"id": "20-hide-region", "group": "explore", "zh": ["隐藏与撤销，保留原始数据", "隐藏选中的语义区域后，其对应高斯从画面中消失。已验证撤销恢复；隐藏不会删除源文件，也不会自动填补露出的空洞。"], "en": ["Hide a region and keep the source", "Hiding the selected semantic region removes its Gaussians from view. Undo restoration was verified. Hiding retains the source file and does not automatically fill exposed gaps."]}, {"id": "19-command-undo", "group": "explore", "zh": ["一句指令，恢复场景", "输入 undo，App 执行本地文字指令并恢复被隔离的场景。已验证文字撤销；界面也提供查找、定位、隐藏等指令入口。"], "en": ["Restore the scene with a command", "Typing undo runs a local text command and restores the isolated scene. Text-based undo was verified; the command bar also supports finding, focusing and hiding regions."]}, {"id": "18-isolate-region", "group": "explore", "zh": ["隔离区域，检查语义覆盖", "隔离选中的桌面区域，直接检查当前训练覆盖了哪些高斯。快速版的覆盖仍有空缺；这张实测截图展示区域隔离操作。"], "en": ["Isolate a region to inspect coverage", "Isolate the selected table region to inspect its assigned Gaussians. Coverage in this Fast result is incomplete; this measured view demonstrates region isolation."]}, {"id": "21-save-result", "group": "explore", "zh": ["保存完整场景，继续使用", "原生 App 已实际导出完整 .splat.jsonl，包含所有高斯、球谐系数、已有语义和当前显示设置。此处将文件命名为 Teatime-Fast；保存窗口的系统按钮跟随 macOS 语言。"], "en": ["Save a complete, reusable scene", "The native App exported a complete .splat.jsonl with all Gaussians, spherical harmonics, available semantics and visibility settings. The file is named Teatime-Fast here. System dialog buttons follow the macOS language."]}];const q=new URLSearchParams(location.search),lang=q.get("lang")==="en"?"en":"zh",id=q.get("shot")||cards[0].id,c=cards.find(c=>c.id===id)||cards[0];document.documentElement.lang=lang;if(id==="21-save-result")document.querySelector(".frame").classList.add("compact");document.getElementById("step").textContent=String(cards.indexOf(c)+1).padStart(2,"0")+" / WORKFLOW";document.getElementById("title").textContent=c[lang][0];document.getElementById("desc").textContent=c[lang][1];document.getElementById("screen").src="screenshots/"+c.id+"-"+lang+".jpg";document.getElementById("screen").alt=c[lang][0];document.getElementById("detail").textContent=lang==="en"?"Captured from the native macOS App. Original screenshot, with presentation captions.":"原生 macOS App 实际操作截图。保留原始界面，配以展示说明。";document.getElementById("foot").textContent=lang==="en"?"ENGLISH · SPLAT STUDIO 0.4.2":"简体中文 · SPLAT STUDIO 0.4.2";</script></html>
